name: Bug
description: A skill did something wrong, confusing or inconsistent
labels: [bug]
body:
  - type: dropdown
    id: host
    attributes:
      label: Where were you using it?
      options: [Claude Code, Cursor, Other]
    validations: { required: true }
  - type: input
    id: skill
    attributes:
      label: Which skill?
      placeholder: craft-prd
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Shipcraft version
      placeholder: "0.1.0"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: A short excerpt of the conversation helps most. Remove anything private.
    validations: { required: true }
